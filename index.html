<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綾路 — AYAJI</title><link rel="stylesheet" href="style.css"><script defer src="rules.js"></script><script defer src="app.js"></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true">〣</span> AYAJI</div><button id="help" aria-haspopup="dialog">ルール</button></header>
<main><div class="heading"><div><small>ふたりの盤上遊戯</small><h1>綾路<span>あやじ</span></h1></div><div class="headingActions"><button id="undo">↶ 一手戻す</button><button id="restart">↺ はじめから</button></div></div>
<div class="layout"><section class="frame" aria-label="対局盤"><div class="edge">朱の到達辺</div><div id="board"></div><div class="edge">藍の到達辺</div></section>
<aside><label id="opponent"><small>対戦相手</small><select id="cpu"><option value="">ふたりで対戦</option><option value="easy">CPU · かんたん</option><option value="normal">CPU · ふつう</option><option value="hard">CPU · むずかしい</option></select></label><section id="online"><label id="nameField"><small>あなたの名前</small><input id="playerName" maxlength="12" autocomplete="nickname" placeholder="相手に表示されます"></label><button id="createRoom">オンライン対戦</button>
<p id="roomStatus" aria-live="polite"></p>
<div id="roomTools" hidden><ul id="presence" aria-label="接続状況"></ul><input id="invite" aria-label="招待リンク" readonly><button id="copyInvite">招待リンクをコピー</button><button id="leaveRoom">部屋を出る</button></div>
</section><small>対局状況</small><h2 id="status" aria-live="polite"></h2><div id="count"></div><hr><small>残りの壁</small><div id="stock"></div><hr><small>この手の操作</small><div class="actions"><button data-mode="move">◇　駒を進める</button><button data-mode="h">━　横壁を置く</button><button data-mode="v">┃　縦壁を置く</button></div><p id="hint" aria-live="polite"></p></aside></div></main>
<template id="rulesText"><h3>勝ち方</h3><p>9×9 の盤で、朱は下から上へ、藍は上から下へ駒を進めます。向こう岸（「到達辺」と書かれた端の列）のどのマスでもよいので、先に着いた方の勝ちです。朱が先手です。</p><h3>自分の手番でできること</h3><p>次のどちらか1つを行います。</p><ul><li>駒を1回動かす</li><li>壁を1枚置く</li></ul><h3>駒の動き</h3><ul><li>上下左右に1マス進みます。斜めには進めません。</li><li>壁を越えて進むことはできません。</li><li>相手の駒が隣にいるときは、飛び越えてその先のマスへ進めます。</li><li>相手の背後が壁か盤の端で飛び越えられないときは、相手の左右（自分から見て斜め）に回り込めます。</li></ul><h3>壁</h3><ul><li>壁は長さ2マスで、1人10枚ずつ持っています。使い切ったら、あとは駒を動かすだけです。</li><li>ほかの壁と重ねたり、十字に交差させたりはできません。</li><li>どちらかの駒がゴールへ行けなくなる置き方はできません。遠回りさせるのは自由です。</li></ul><h3>操作</h3><ul><li><b>駒を進める</b>：点の付いたマスを押すと、そこへ動きます。</li><li><b>横壁を置く・縦壁を置く</b>：ボタンを選んでから、壁の中心にしたいマスの角（交点）を押します。</li><li><b>一手戻す</b>：手元での対戦のときだけ使えます。</li></ul><h3>対戦のしかた</h3><ul><li><b>ふたりで対戦</b>：1台の端末を交互に使います。</li><li><b>CPU</b>：「対戦相手」で強さを選びます。あなたが朱（先手）、CPU が藍です。</li><li><b>オンライン対戦</b>：部屋を作り、招待リンクを相手に送ります。リンクで入れるのは1人だけです。部屋を作った人が朱、参加した人が藍になります。</li></ul></template><dialog id="dialog"><h2 id="dialogTitle" tabindex="-1"></h2><div id="dialogText"></div><div class="dialogActions"><button id="close">閉じる</button><button id="confirm" hidden>新しく始める</button></div></dialog></body></html>
